<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Dial Mobile Mode · ONYX</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="dial-mode">
<div id="chrome"></div>
<main class="dial-wrap">
  <header class="dial-head">
    <div class="dial-title-group"><a class="dial-back" id="dialBack" href="/pipeline/" aria-label="Back to lead">←</a><div><p class="eyebrow">Mobile workspace</p><h1>Dial Mobile Mode</h1><p class="hint" id="queueStatus">Loading your call queue…</p></div></div>
    <button class="dial-summary-toggle" id="summaryToggle" type="button" aria-expanded="true" aria-controls="dialSummary"><span class="sr-only">Toggle today's performance</span><span aria-hidden="true" id="summaryArrow">↑</span></button>
  </header>
  <section class="dial-summary" id="dialSummary" aria-label="Today's performance">
    <div><strong id="dialsToday">0</strong><span>Dials</span></div><div><strong id="answeredToday">0</strong><span>Answered</span></div><div><strong id="appointmentsToday">0</strong><span>Appointments</span></div><div><strong id="conversionToday">0%</strong><span>Set rate</span></div>
  </section>
  <section class="mobile-lead" id="leadCard" aria-live="polite"><div class="dial-loading">Finding the next lead…</div></section>
  <section class="dial-history-section">
    <div class="section-title-row"><div><p class="eyebrow">Activity</p><h2>Call history</h2></div><button class="link" id="refreshHistory" type="button">Refresh</button></div>
    <div class="dial-history" id="dialHistory"><p class="hint">Loading recent calls…</p></div>
  </section>
</main>
<script src="/assets/config.js"></script><script src="/assets/onyx.js"></script>
<script>
Onyx.requireAuth(function () {
  'use strict';
  var queue = [], index = 0, dialStarted = false, directId = Onyx.qs('id'), selectedOutcome = null;
  var OUTCOMES = [
    { label: 'No answer', stage: '', tone: 'neutral' }, { label: 'Hung up', stage: 'Contacted', tone: 'neutral' },
    { label: 'Not interested', stage: 'Lost', tone: 'bad' }, { label: 'Left voicemail', stage: '', tone: 'neutral' },
    { label: 'Gatekeeper', stage: '', tone: 'neutral' }, { label: 'Interested', stage: 'Interested', tone: 'good' },
    { label: 'Appointment set', stage: 'Demo Booked', tone: 'great' }, { label: 'Call back', stage: 'Contacted', tone: 'neutral' }
  ];
  if (directId) document.getElementById('dialBack').href = '/lead/?id=' + encodeURIComponent(directId);
  document.getElementById('summaryToggle').addEventListener('click', function () { var summary = document.getElementById('dialSummary'), open = !summary.hidden; summary.hidden = open; this.setAttribute('aria-expanded', String(!open)); document.getElementById('summaryArrow').textContent = open ? '↓' : '↑'; });
  document.getElementById('refreshHistory').addEventListener('click', loadStats);
  loadQueue(); loadStats();
  function dayBounds() { var start = new Date(); start.setHours(0, 0, 0, 0); var end = new Date(start); end.setDate(end.getDate() + 1); return { dayStart: start.toISOString(), dayEnd: end.toISOString() }; }
  function loadQueue() {
    if (directId) {
      Onyx.sheet('getLead', { id: directId }).then(function (r) { if (!r.ok) { showError(r.error); return; } queue = [r.lead]; index = 0; document.getElementById('queueStatus').textContent = 'Selected from the pipeline'; renderLead(); });
      return;
    }
    Onyx.sheet('callQueue', { mine: true, size: 100 }).then(function (r) { if (!r.ok) { showError(r.error); return; } queue = r.queue || []; index = 0; document.getElementById('queueStatus').textContent = queue.length ? queue.length + ' leads ready · due callbacks first' : 'Your queue is clear'; renderLead(); });
  }
  function loadStats() { Onyx.sheet('dialMobileStats', dayBounds()).then(function (r) { if (!r.ok) return; var t = r.today || {}; document.getElementById('dialsToday').textContent = t.dials || 0; document.getElementById('answeredToday').textContent = t.answered || 0; document.getElementById('appointmentsToday').textContent = t.appointments || 0; document.getElementById('conversionToday').textContent = (t.dials ? Math.round((t.appointments || 0) / t.dials * 100) : 0) + '%'; renderHistory(r.history || []); }); }
  function renderLead() {
    dialStarted = false; selectedOutcome = null; var card = document.getElementById('leadCard');
    if (!queue.length || index >= queue.length) { card.innerHTML = '<div class="dial-empty"><span class="dial-check">✓</span><h2>Queue complete</h2><p>You have worked through every available lead.</p><button class="btn primary" id="reloadQueue">Check again</button></div>'; document.getElementById('reloadQueue').addEventListener('click', loadQueue); return; }
    var l = queue[index], phone = String(l.phone || '').replace(/\D/g, '');
    card.innerHTML = '<div class="lead-top"><div><span class="queue-position">' + (directId ? 'Selected lead' : 'Lead ' + (index + 1) + ' of ' + queue.length) + '</span><h2>' + Onyx.esc(l.name) + '</h2><p>' + Onyx.esc([l.category, l.city, l.state].filter(Boolean).join(' · ')) + '</p></div><button class="lead-detail-toggle" id="detailToggle" type="button" aria-expanded="false" aria-controls="leadDetails"><span class="sr-only">Show lead details</span><span aria-hidden="true" id="detailArrow">↓</span></button></div>' +
      '<div class="lead-details" id="leadDetails" hidden>' +
        optionalDetail('Address', [l.street, l.city, l.state, l.zip].filter(Boolean).join(', ')) + optionalDetail('Rating', l.rating ? l.rating + ' (' + (l.reviewCount || 0) + ' reviews)' : '') +
        detailRow('Decision maker', l.dmName ? l.dmName + (l.dmTitle ? ', ' + l.dmTitle : '') : 'Ask who handles equipment purchases') + optionalDetail('Email', l.email) + optionalDetail('Direct phone', l.directPhone) +
        detailRow('Lead score', l.leadScore || 'Not scored') + detailRow('Buyer type', l.buyerType || 'Unknown') + optionalDetail('Services', l.services) + optionalDetail('Known equipment', l.existingEquipment) + optionalDetail('Sales angle', l.salesAngle || l.openingAngle) +
        detailRow('Previous calls', l.callAttempts || 0) + detailRow('Last result', l.callOutcome || 'No calls yet') + (l.nextActionDate ? detailRow('Callback due', Onyx.shortDate(l.nextActionDate)) : '') +
        (l.suggestedMessage ? '<div class="call-script"><span>Suggested opener</span><p>' + Onyx.esc(l.suggestedMessage) + '</p></div>' : '') + '</div>' +
      '<a class="mobile-call-button" id="callNow" href="tel:' + Onyx.esc(phone) + '"><span class="phone-icon" aria-hidden="true">☎</span><span><small>Tap to call</small>' + Onyx.esc(l.phone || 'No phone') + '</span></a>' +
      '<div class="outcome-panel" id="outcomePanel"' + (directId ? '' : ' hidden') + '><div class="outcome-title-row"><p class="outcome-prompt">How did the call go?</p><span>Tap one result</span></div><div class="mobile-outcomes">' + OUTCOMES.map(function (o, i) { return '<button type="button" class="outcome-chip ' + o.tone + '" data-outcome="' + i + '">' + Onyx.esc(o.label) + '</button>'; }).join('') + '</div>' +
        '<div class="call-result-fields" id="callResultFields" hidden><div class="result-grid">' +
          '<label><span>Who answered?</span><select id="answeredBy"><option value="">Select</option><option>Decision maker</option><option>Staff / gatekeeper</option><option>Voicemail</option><option>No one</option><option>Wrong person</option></select></label>' +
          '<label><span>Interest</span><select id="interestLevel"><option value="">Select</option><option>Hot</option><option>Warm</option><option>Cold</option><option>Not established</option></select></label>' +
          '<label><span>Call length</span><select id="callDuration"><option value="">Select</option><option>Under 1 minute</option><option>1–3 minutes</option><option>3–5 minutes</option><option>5–10 minutes</option><option>10+ minutes</option></select></label>' +
          '<label><span>Main objection</span><select id="callObjection"><option value="">None / unknown</option><option>Price</option><option>Timing</option><option>No budget</option><option>Already has equipment</option><option>Not the decision maker</option><option>Not interested</option><option>Needs more information</option></select></label>' +
          '<label><span>Next step</span><select id="callNextStep"><option value="">None</option><option>Call back</option><option>Send information</option><option>Send email</option><option>Schedule demo</option><option>Appointment set</option><option>Do not contact</option></select></label>' +
          '<label><span>Contact name</span><input id="contactReached" placeholder="Who did you speak with?"></label>' +
          '<label><span>Callback date</span><input id="callbackDate" type="date"></label>' +
          '<label><span>Appointment</span><input id="appointmentAt" type="datetime-local"></label>' +
        '</div><label class="result-note"><span>Call notes</span><textarea id="callNote" rows="3" placeholder="Key details, needs, objections, or promises made"></textarea></label><button class="btn primary full save-call-result" id="saveCallResult" type="button">Save call result</button></div><p class="msg" id="dialMsg"></p></div>' +
      '<div class="dial-nav">' + (directId ? '<a class="btn quiet" href="/lead/?id=' + encodeURIComponent(directId) + '">← Lead record</a><a class="btn quiet" href="/dial-mobile/">Open call queue →</a>' : '<button class="btn quiet" id="previousLead" type="button"' + (index === 0 ? ' disabled' : '') + '>← Previous</button><button class="btn quiet" id="skipLead" type="button">Skip <span aria-hidden="true">→</span></button>') + '</div>';
    document.getElementById('detailToggle').addEventListener('click', toggleDetails);
    document.getElementById('callNow').addEventListener('click', function (e) { e.preventDefault(); if (dialStarted) { location.href = this.href; return; } dialStarted = true; document.getElementById('outcomePanel').hidden = false; Onyx.sheet('logDialStart', { id: l.id }).then(function () { loadStats(); location.href = 'tel:' + phone; }); });
    Array.prototype.forEach.call(card.querySelectorAll('[data-outcome]'), function (button) { button.addEventListener('click', function () { chooseOutcome(Number(button.dataset.outcome), button); }); });
    document.getElementById('saveCallResult').addEventListener('click', function () { if (selectedOutcome) saveOutcome(l, selectedOutcome, this); });
    if (!directId) { document.getElementById('previousLead').addEventListener('click', function () { if (index > 0) { index--; renderLead(); scrollToCard(); } }); document.getElementById('skipLead').addEventListener('click', function () { index++; renderLead(); scrollToCard(); }); }
  }
  function detailRow(label, value) { return '<div><span>' + Onyx.esc(label) + '</span><strong>' + Onyx.esc(value) + '</strong></div>'; }
  function optionalDetail(label, value) { return value ? detailRow(label, value) : ''; }
  function chooseOutcome(outcomeIndex, button) {
    selectedOutcome = OUTCOMES[outcomeIndex];
    Array.prototype.forEach.call(document.querySelectorAll('.outcome-chip'), function (x) { x.classList.remove('selected'); });
    button.classList.add('selected'); document.getElementById('callResultFields').hidden = false;
    if (selectedOutcome.label === 'Appointment set') document.getElementById('callNextStep').value = 'Appointment set';
    if (selectedOutcome.label === 'Call back') document.getElementById('callNextStep').value = 'Call back';
    if (selectedOutcome.label === 'Not interested') document.getElementById('callNextStep').value = 'Do not contact';
    document.getElementById('saveCallResult').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function toggleDetails() { var d = document.getElementById('leadDetails'), open = !d.hidden; d.hidden = open; this.setAttribute('aria-expanded', String(!open)); document.getElementById('detailArrow').textContent = open ? '↓' : '↑'; }
  function scrollToCard() { document.getElementById('leadCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  function saveOutcome(lead, outcome, button) {
    button.disabled = true; Array.prototype.forEach.call(document.querySelectorAll('.outcome-chip'), function (x) { x.disabled = true; }); Onyx.msg('dialMsg', 'Saving result…');
    var details = { answeredBy: valueOf('answeredBy'), interest: valueOf('interestLevel'), duration: valueOf('callDuration'), objection: valueOf('callObjection'), nextStep: valueOf('callNextStep'), contactReached: valueOf('contactReached'), appointmentAt: valueOf('appointmentAt') };
    Onyx.sheet('logCall', { id: lead.id, outcome: outcome.label, stage: outcome.stage, note: valueOf('callNote'), nextAction: details.nextStep, nextActionDate: valueOf('callbackDate'), details: details }).then(function (r) { if (!r.ok) { Onyx.msg('dialMsg', r.error, 'bad'); button.disabled = false; Array.prototype.forEach.call(document.querySelectorAll('.outcome-chip'), function (x) { x.disabled = false; }); return; } Onyx.msg('dialMsg', directId ? 'Everything was recorded. You can return to the lead record.' : 'Saved. Loading next lead…', 'good'); loadStats(); if (!directId) setTimeout(function () { queue.splice(index, 1); renderLead(); scrollToCard(); }, 650); });
  }
  function valueOf(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function renderHistory(items) { var box = document.getElementById('dialHistory'); if (!items.length) { box.innerHTML = '<div class="history-empty">Your logged calls will appear here.</div>'; return; } box.innerHTML = items.map(function (item) { var parts = String(item.detail || 'Called').split(' — '), outcome = parts.shift(); return '<a class="history-row" href="/lead/?id=' + encodeURIComponent(item.leadId || '') + '"><span class="history-dot"></span><span class="history-main"><strong>' + Onyx.esc(item.leadName || 'Lead') + '</strong><small>' + Onyx.esc(parts.join(' — ') || outcome) + '</small></span><span class="history-meta"><b>' + Onyx.esc(outcome) + '</b><small>' + formatTime(item.at) + '</small></span></a>'; }).join(''); }
  function formatTime(value) { var d = new Date(value); return isNaN(d) ? '' : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function showError(message) { document.getElementById('leadCard').innerHTML = '<div class="dial-empty"><h2>Could not load leads</h2><p>' + Onyx.esc(message) + '</p><button class="btn primary" onclick="location.reload()">Try again</button></div>'; }
});
</script>
</body>
</html>
