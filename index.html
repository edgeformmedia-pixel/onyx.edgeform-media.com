<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ONYX</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="auth">
  <form class="auth-card" id="form">
    <div class="brand">ONYX</div>
    <p class="sub">Edgeform Media sales</p>

    <div class="field">
      <label for="u">Username or email</label>
      <input type="text" id="u" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input type="password" id="p" autocomplete="current-password" required>
    </div>

    <button class="btn primary full" type="submit" id="go">Sign in</button>
    <p class="msg" id="m"></p>

    <div class="auth-foot">
      <a href="/signup/">Request access</a>
      <button type="button" class="link" id="forgot">Forgot password</button>
    </div>
  </form>
</div>

<script src="/assets/config.js"></script>
<script src="/assets/onyx.js"></script>
<script>
(function () {
  if (Onyx.qs('expired')) Onyx.msg('m', 'Your session expired. Sign in again.', 'warn');

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('go');
    btn.disabled = true;
    Onyx.msg('m', 'Checking...');

    Onyx.sheet('login', {
      username: document.getElementById('u').value.trim(),
      password: document.getElementById('p').value
    }).then(function (r) {
      btn.disabled = false;
      if (!r.ok) { Onyx.msg('m', r.error || 'Sign-in failed.', 'bad'); return; }
      Onyx.setSession(r.token, r.user);
      location.href = '/home/';
    });
  });

  document.getElementById('forgot').addEventListener('click', function () {
    var email = prompt('What email address is on your account?');
    if (!email) return;
    Onyx.msg('m', 'Sending...');
    Onyx.sheet('forgotPassword', { email: email.trim() }).then(function (r) {
      Onyx.msg('m', r.message || 'If that address has an account, a reset link is on its way.', 'good');
    });
  });
})();
</script>
</body>
</html>
