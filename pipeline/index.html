<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline · ONYX</title>
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/campaigns.css">
</head>
<body>
<div id="chrome"></div>
<div class="wrap">
  <div class="page-head">
    <div><h1>Pipeline</h1><p class="hint" id="sub">Loading...</p></div>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search business, city, contact, phone...">
    <select id="stage"><option value="">All stages</option></select>
    <select id="sort"><option value="score">Sort: highest score</option><option value="city_asc">City: A–Z</option><option value="city_desc">City: Z–A</option></select>
    <div class="city-picker">
      <input type="search" id="cityInput" list="cityOptions" placeholder="Filter cities — type, then Enter" autocomplete="off">
      <datalist id="cityOptions"></datalist>
      <div class="city-chips" id="cityChips" aria-live="polite"></div>
    </div>
    <select id="decisionMaker"><option value="">Any decision maker</option><option value="has">Has decision maker</option><option value="missing">No decision maker</option></select>
    <select id="emailStatus"><option value="">Any email status</option><option value="has">Has email</option><option value="missing">No email</option></select>
    <select id="laser" aria-label="Laser machine"><option value="">Any laser status</option><option value="yes">Has laser machine</option><option value="no">No laser machine</option><option value="unmarked">Laser not marked yet</option></select>
    <label class="chk"><input type="checkbox" id="chains"> Hide chains</label>
    <label class="chk"><input type="checkbox" id="noResearch"> Missing owner or email</label>
    <button class="btn quiet compact" id="researchToggle" type="button" aria-expanded="false" aria-controls="bulkResearch">Auto research</button>
    <button class="btn quiet compact" id="reload">Refresh</button>
  </div>

  <details class="city-menu" id="cityMenu"><summary>Available cities</summary><div id="cityList" class="city-list"></div></details>

  <section class="bulk-research" id="bulkResearch" aria-labelledby="bulkResearchTitle" hidden>
    <div><b id="bulkResearchTitle">Find owners and emails</b><p class="hint">Finds only the owner name and best published email for each matching lead.</p></div>
    <label>Next <input id="researchAmount" type="number" min="1" max="1000" value="10" inputmode="numeric"> leads</label>
    <span class="hint" id="researchEstimate"></span>
    <button class="btn primary" id="autoResearch">Find owner + email for next 10</button>
    <p class="msg" id="bulkProgress"></p>
  </section>

  <div class="select-matching" id="selectMatchingRow" hidden>
    <span class="hint" id="selectMatchingHint"></span>
    <button class="btn quiet compact" type="button" id="selectMatching">Select all matching</button>
  </div>

  <div class="tablewrap">
    <table class="grid">
      <thead><tr>
        <th class="sel-col"><input type="checkbox" id="selectPage" aria-label="Select all leads on this page"></th>
        <th style="width:64px">Score</th><th>Business</th><th>City</th>
        <th>Decision maker</th><th>Email</th><th>Phone</th><th>Laser machine</th><th>Stage</th><th>Owner</th><th>Campaign</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="pipe-select-bar" id="selectBar" hidden>
    <strong id="selectCount"></strong>
    <span class="select-progress" id="selectProgress"></span>
    <button class="btn quiet compact" type="button" id="selectClear">Clear</button>
    <button class="btn quiet compact" type="button" id="selectResearch" title="Find owner + best email for every selected lead, even ones already researched">Research selected</button>
    <button class="btn primary compact" type="button" id="selectEnroll">Add to campaign</button>
  </div>

  <div class="pager">
    <button class="btn quiet compact" id="prev">Back</button>
    <span id="pageInfo"></span>
    <button class="btn quiet compact" id="next">Next</button>
  </div>
</div>

<script src="/assets/config.js"></script>
<script src="/assets/onyx.js"></script>
<script src="/assets/campaign-ui.js"></script>
<script src="/assets/research-queue.js"></script>
<script>
Onyx.requireAuth(function () {
  var page = 0, size = 50, selectedCities = [], cityIndex = [], bulkStop = false, bulkRunning = false;
  var selectedLeads = {}, pageLeadIds = [], matchingTotal = 0;

  function laserSelect(l) {
    var auto = l.laserAuto ? 'Auto: has laser' : 'Auto: no laser found';
    return '<select class="laser-pick' + (l.hasLaser ? ' marked' : '') + '" data-laser-lead="' + Onyx.esc(l.id) + '" aria-label="Laser machine for ' + Onyx.esc(l.name) + '">' +
      '<option value=""' + (!l.hasLaser ? ' selected' : '') + '>' + auto + '</option>' +
      '<option value="yes"' + (l.hasLaser === 'yes' ? ' selected' : '') + '>Has laser</option>' +
      '<option value="no"' + (l.hasLaser === 'no' ? ' selected' : '') + '>No laser</option></select>';
  }

  function filterSummary() {
    var parts = [];
    if (selectedCities.length) parts.push(selectedCities.join(', '));
    var laser = document.getElementById('laser');
    if (laser.value) parts.push(laser.options[laser.selectedIndex].textContent.toLowerCase());
    var stage = document.getElementById('stage').value;
    if (stage) parts.push(stage);
    var email = document.getElementById('emailStatus');
    if (email.value) parts.push(email.options[email.selectedIndex].textContent.toLowerCase());
    return matchingTotal.toLocaleString() + ' leads match' + (parts.length ? ': ' + parts.join(' · ') : '');
  }

  if (Onyx.qs('needsEmail')) document.getElementById('emailStatus').value = 'missing';
  if (Onyx.qs('needsResearch')) document.getElementById('noResearch').checked = true;

  function payload(extra) {
    return Object.assign({
      q: document.getElementById('q').value,
      stage: document.getElementById('stage').value,
      sort: document.getElementById('sort').value,
      cities: selectedCities,
      decisionMakerStatus: document.getElementById('decisionMaker').value,
      emailStatus: document.getElementById('emailStatus').value,
      hideChains: document.getElementById('chains').checked,
      needsContactResearch: document.getElementById('noResearch').checked,
      laser: document.getElementById('laser').value,
      page: page, size: size
    }, extra || {});
  }

  function renderCities() {
    document.getElementById('cityChips').innerHTML = selectedCities.map(function (city) {
      return '<button type="button" class="city-chip" data-city="' + Onyx.esc(city) + '">' + Onyx.esc(city) + ' <span aria-hidden="true">×</span></button>';
    }).join('');
  }

  function addCity(raw) {
    var typed = String(raw || '').trim();
    if (!typed) return false;
    var match = cityIndex.find(function (x) { return x.city.toLowerCase() === typed.toLowerCase(); }) ||
      cityIndex.find(function (x) { return x.city.toLowerCase().indexOf(typed.toLowerCase()) === 0; });
    if (!match) return false;
    if (selectedCities.indexOf(match.city) === -1) selectedCities.push(match.city);
    document.getElementById('cityInput').value = '';
    renderCities(); page = 0; load();
    return true;
  }

  function updateEstimate() {
    var count = Math.min(1000, Math.max(1, Number(document.getElementById('researchAmount').value) || 1));
    document.getElementById('researchEstimate').textContent = 'One focused AI search per lead.';
    document.getElementById('autoResearch').textContent = 'Find owner + email for next ' + count.toLocaleString();
  }

  Promise.all([Onyx.sheet('stats', {}), Onyx.sheet('pipelineFacets', {})]).then(function (parts) {
    var r = parts[0], facets = parts[1];
    if (!r.ok) return;
    var sel = document.getElementById('stage');
    r.stages.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s; o.textContent = s;
      sel.appendChild(o);
    });
    var want = Onyx.qs('stage');
    if (want) sel.value = want;
    if (facets.ok) {
      cityIndex = facets.cities || [];
      document.getElementById('cityOptions').innerHTML = cityIndex.map(function (x) {
        return '<option value="' + Onyx.esc(x.city) + '">' + Onyx.esc(x.city) + ' (' + x.count + ')</option>';
      }).join('');
      document.getElementById('cityList').innerHTML = cityIndex.map(function (x) {
        return '<button type="button" data-city="' + Onyx.esc(x.city) + '">' + Onyx.esc(x.city) + ' <span>' + x.count + '</span></button>';
      }).join('');
    }
    renderCities(); updateEstimate();
    load();
  });

  function load() {
    document.getElementById('rows').innerHTML = '<tr><td colspan="11" class="muted">Loading...</td></tr>';
    Onyx.sheet('listLeads', payload()).then(render);
  }

  function render(r) {
    var tb = document.getElementById('rows');
    if (!r.ok) { tb.innerHTML = '<tr><td colspan="11" class="muted">' + Onyx.esc(r.error) + '</td></tr>'; return; }

    document.getElementById('sub').textContent = r.total + ' leads match';

    try {
      sessionStorage.setItem('onyx_pipeline_nav', JSON.stringify({
        ids: (r.leads || []).map(function (l) { return l.id; }),
        names: (r.leads || []).map(function (l) { return l.name || ''; }),
        page: r.page || 0,
        total: r.total || 0,
        request: payload()
      }));
    } catch (_) { }

    if (!r.leads.length) {
      tb.innerHTML = '<tr><td colspan="11"><div class="empty-state"><h3>Nothing here</h3>' +
        '<p class="hint">Loosen the filters, or run the LeadHunter extension to pull more leads in.</p>' +
        '</div></td></tr>';
    } else {
      tb.innerHTML = r.leads.map(function (l) {
        return '<tr class="click" data-id="' + Onyx.esc(l.id) + '">' +
          '<td class="sel-col"><input type="checkbox" data-select-lead="' + Onyx.esc(l.id) + '"' + (selectedLeads[l.id] ? ' checked' : '') + ' aria-label="Select ' + Onyx.esc(l.name) + '"></td>' +
          '<td><span class="' + Onyx.scoreClass(l.leadScore) + '">' + (l.leadScore || '-') + '</span></td>' +
          '<td>' + Onyx.esc(l.name) +
            (String(l.isNationalChain) === 'Yes' ? '<span class="tag chain">chain</span>' : '') +
            (l.needsHumanReview === true || String(l.needsHumanReview).toUpperCase() === 'TRUE'
              ? '<span class="tag review">review</span>' : '') + '</td>' +
          '<td>' + Onyx.esc(l.city || '') + '</td>' +
          '<td>' + (l.dmName
            ? Onyx.esc(l.dmName) + (l.dmTitle ? '<span class="tag">' + Onyx.esc(l.dmTitle) + '</span>' : '')
            : '<span class="muted">not found</span>') + '</td>' +
          '<td>' + (l.email ? Onyx.esc(l.email) : '<span class="muted">-</span>') + '</td>' +
          '<td>' + Onyx.esc(l.phone || '') + '</td>' +
          '<td>' + laserSelect(l) + '</td>' +
          '<td>' + Onyx.esc(l.stage || '') + '</td>' +
          '<td>' + Onyx.esc(l.owner || '') + '</td>' +
          '<td><button class="btn quiet compact" type="button" data-enroll-lead="' + Onyx.esc(l.id) + '"' + (l.email ? '' : ' disabled title="No email yet"') + '>Add to campaign</button></td></tr>';
      }).join('');
    }
    pageLeadIds = (r.leads || []).map(function (l) { return String(l.id); });
    lastSelectIndex = -1;
    matchingTotal = r.total || 0;
    document.getElementById('selectMatchingRow').hidden = !matchingTotal;
    document.getElementById('selectMatching').textContent = 'Select all ' + Math.min(matchingTotal, 1000).toLocaleString() + (matchingTotal > 1000 ? ' (first 1,000)' : '') + ' matching';
    document.getElementById('selectMatchingHint').textContent = filterSummary();
    updateSelection();

    var start = r.page * size;
    document.getElementById('pageInfo').textContent = r.total
      ? (start + 1) + '-' + Math.min(r.total, start + size) + ' of ' + r.total : '0';
    document.getElementById('prev').disabled = r.page === 0;
    document.getElementById('next').disabled = start + size >= r.total;
  }

  function updateSelection() {
    var ids = Object.keys(selectedLeads).filter(function (id) { return selectedLeads[id]; });
    document.getElementById('selectBar').hidden = !ids.length;
    document.getElementById('selectCount').textContent = ids.length + ' lead' + (ids.length === 1 ? '' : 's') + ' selected';
    var onPage = pageLeadIds.filter(function (id) { return selectedLeads[id]; }).length;
    document.getElementById('selectPage').checked = pageLeadIds.length > 0 && onPage === pageLeadIds.length;
    document.getElementById('selectPage').indeterminate = onPage > 0 && onPage < pageLeadIds.length;
  }
  document.getElementById('selectMatching').addEventListener('click', function () {
    var button = this;
    button.disabled = true; button.textContent = 'Selecting…';
    Onyx.sheet('listLeads', payload({ page: 0, size: 1000 })).then(function (r) {
      button.disabled = false;
      if (!r.ok) { alert(r.error || 'Could not load matching leads.'); return; }
      (r.leads || []).forEach(function (l) { selectedLeads[l.id] = true; });
      document.querySelectorAll('[data-select-lead]').forEach(function (box) { box.checked = !!selectedLeads[box.dataset.selectLead]; });
      button.textContent = 'Selected ' + (r.leads || []).length.toLocaleString() + ' matching';
      updateSelection();
    });
  });

  document.getElementById('rows').addEventListener('change', function (e) {
    var pick = e.target.closest('[data-laser-lead]');
    if (pick) {
      pick.disabled = true;
      Onyx.sheet('updateLead', { id: pick.dataset.laserLead, fields: { hasLaser: pick.value } }).then(function (r) {
        pick.disabled = false;
        pick.classList.toggle('marked', !!pick.value);
        if (!r.ok) alert(r.error || 'Could not save.');
      });
      return;
    }
    var box = e.target.closest('[data-select-lead]'); if (!box) return;
    selectedLeads[box.dataset.selectLead] = box.checked; updateSelection();
  });
  document.querySelector('thead .sel-col').addEventListener('click', function (e) {
    if (!e.target.closest('input')) document.getElementById('selectPage').click();
  });
  document.getElementById('selectPage').addEventListener('change', function () {
    var on = this.checked;
    pageLeadIds.forEach(function (id) { selectedLeads[id] = on; });
    document.querySelectorAll('[data-select-lead]').forEach(function (box) { box.checked = on; });
    updateSelection();
  });
  document.getElementById('selectClear').addEventListener('click', function () {
    selectedLeads = {};
    document.querySelectorAll('[data-select-lead]').forEach(function (box) { box.checked = false; });
    updateSelection();
  });
  document.getElementById('selectEnroll').addEventListener('click', function () {
    var ids = Object.keys(selectedLeads).filter(function (id) { return selectedLeads[id]; });
    OnyxCampaigns.enroll(ids, { onDone: function () { selectedLeads = {}; load(); } });
  });

  var lastSelectIndex = -1;
  document.getElementById('selectResearch').addEventListener('click', function () {
    var ids = Object.keys(selectedLeads).filter(function (id) { return selectedLeads[id]; });
    if (!ids.length) return;
    if (ids.length > 25 && !confirm('Research ' + ids.length + ' leads? Each one runs an AI web search, one at a time.')) return;
    var names = {};
    document.querySelectorAll('tr[data-id]').forEach(function (tr) { names[tr.dataset.id] = (tr.children[2] && tr.children[2].firstChild && tr.children[2].firstChild.textContent) || ''; });
    var added = OnyxResearch.add(ids.map(function (id) { return { id: id, name: names[id] || '' }; }), { force: true });
    document.getElementById('selectProgress').textContent = added ? added + ' added to the research queue below' : 'Already in the research queue';
  });

  document.getElementById('rows').addEventListener('click', function (e) {
    var check = e.target.closest('[data-select-lead]');
    var cell = !check && e.target.closest('td.sel-col');
    if (cell) {
      // The whole checkbox cell is clickable, not just the box itself.
      check = cell.querySelector('[data-select-lead]');
      if (!check) return;
      check.checked = !check.checked;
      selectedLeads[check.dataset.selectLead] = check.checked;
      updateSelection();
    }
    if (check) {
      // Shift-click selects (or clears) every row between the last click and this one.
      var index = pageLeadIds.indexOf(check.dataset.selectLead);
      if (e.shiftKey && lastSelectIndex > -1 && index > -1) {
        var from = Math.min(lastSelectIndex, index), to = Math.max(lastSelectIndex, index);
        for (var i = from; i <= to; i++) selectedLeads[pageLeadIds[i]] = check.checked;
        document.querySelectorAll('[data-select-lead]').forEach(function (box) { box.checked = !!selectedLeads[box.dataset.selectLead]; });
        if (window.getSelection) window.getSelection().removeAllRanges();
        updateSelection();
      }
      lastSelectIndex = index;
      return;
    }
    var enroll = e.target.closest('[data-enroll-lead]');
    if (enroll) { OnyxCampaigns.enroll([enroll.dataset.enrollLead]); return; }
    var tr = e.target.closest('tr[data-id]');
    if (e.target.closest('a,button,input,select,label')) return;
    if (tr) location.href = '/lead/?id=' + encodeURIComponent(tr.dataset.id) + '&from=pipeline';
  });

  document.getElementById('q').addEventListener('input', Onyx.debounce(function () { page = 0; load(); }, 350));
  ['stage', 'sort', 'chains', 'noResearch', 'decisionMaker', 'emailStatus', 'laser'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () { page = 0; load(); });
  });
  document.getElementById('cityInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); if (!addCity(this.value)) this.setCustomValidity('Choose a city from the available list.'); }
  });
  document.getElementById('cityInput').addEventListener('change', function () { if (this.value) addCity(this.value); });
  document.getElementById('cityInput').addEventListener('input', function () { this.setCustomValidity(''); });
  document.getElementById('cityChips').addEventListener('click', function (e) {
    var button = e.target.closest('[data-city]'); if (!button) return;
    selectedCities = selectedCities.filter(function (city) { return city !== button.dataset.city; }); renderCities(); page = 0; load();
  });
  document.getElementById('cityList').addEventListener('click', function (e) {
    var button = e.target.closest('[data-city]'); if (button) addCity(button.dataset.city);
  });
  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('prev').addEventListener('click', function () { if (page > 0) { page--; load(); } });
  document.getElementById('next').addEventListener('click', function () { page++; load(); });

  document.getElementById('researchAmount').addEventListener('input', updateEstimate);
  document.getElementById('researchToggle').addEventListener('click', function () {
    var panel = document.getElementById('bulkResearch'), open = panel.hidden;
    panel.hidden = !open; this.setAttribute('aria-expanded', String(open)); this.textContent = open ? 'Hide auto research' : 'Auto research';
  });

  document.getElementById('autoResearch').addEventListener('click', function () {
    var button = this;
    var requested = Math.min(1000, Math.max(1, Number(document.getElementById('researchAmount').value) || 1));
    button.disabled = true;
    Onyx.msg('bulkProgress', 'Finding the next ' + requested.toLocaleString() + ' leads missing an owner or email…');
    Onyx.sheet('listLeads', payload({ page: 0, size: requested, needsContactResearch: true })).then(function (result) {
      button.disabled = false;
      if (!result.ok) { Onyx.msg('bulkProgress', result.error || 'Could not load leads to research.', 'bad'); return; }
      var leads = result.leads || [];
      if (!leads.length) { Onyx.msg('bulkProgress', 'Every matching lead already has an owner and email.', 'warn'); return; }
      var added = OnyxResearch.add(leads.map(function (l) { return { id: l.id, name: l.name }; }), { force: false });
      Onyx.msg('bulkProgress', added + ' lead' + (added === 1 ? '' : 's') + ' added to the research queue at the bottom of the screen. It keeps running while you use the CRM.', 'good');
    });
  });

  // Refresh the table as the background queue saves results.
  var refreshSoon = Onyx.debounce(function () { if (!bulkRunning) load(); }, 1500);
  OnyxResearch.on(function (type) { if (type === 'done' || type === 'finished') refreshSoon(); });
});
</script>
</body>
</html>
